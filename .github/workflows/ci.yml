name: CI Pipeline - Calculadora Java
 
jobs:
  build-and-test:
    name: Build, Test e Analise
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
 
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
 
      - name: Cache de dependências Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
 
      - name: Compilar projeto
        run: mvn clean compile
 
      - name: Executar testes unitários
        run: mvn test

      - name: Empacotar aplicação (JAR)
        run: mvn package -DskipTests
 
      - name: Upload do artefato gerado
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-jar
          path: target/*.jar
          retention-days: 7
 
      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 7
